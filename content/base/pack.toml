name = "base"
version = "0.1.0"
# Enforced (architecture_spec/dev-experience.md §3.7): the server, singleplayer and
# joining clients refuse a pack whose requirement the engine does not satisfy.
# Cargo-style: "*", ">=0.6.0", ">=0.6.0, <0.7.0", "^0.6.1", "~0.6.1". Bundled packs
# ship with the engine and keep "*".
engine_version_req = "*"

# Not read by the engine today: src/script/pack_loader.cpp loads
# blocks/*.lua, entities/*.lua, biomes/*.lua (each sorted), then init.lua,
# in that fixed order -- `require` isn't implemented yet (REMAINING_TASKS.md
# 4.1), so init.lua can't pull the others in itself. Kept here anyway as the
# spec-documented, forward-compatible field (§16) for whenever real `require`
# lands and a pack can choose its own load order. (ui/*.lua is separate --
# loaded into the client's own UiRuntime, not this PackRuntime walk; see
# inc/vb/script/pack_loader.hpp.)
entry = "init.lua"
