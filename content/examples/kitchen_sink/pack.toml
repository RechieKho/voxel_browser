name = "kitchen_sink"
version = "0.1.0"
# See content/base/pack.toml's own comment -- not read/enforced today.
engine_version_req = "*"

# Same load-order caveat as content/base's own pack.toml: real `require`
# doesn't exist yet (REMAINING_TASKS.md 4.1), so src/script/pack_loader.cpp
# loads blocks/*.lua -> entities/*.lua -> biomes/*.lua -> every other
# root-level *.lua file (sorted) -> init.lua, in that fixed order, not
# whatever this file's `entry` implies. (ui/*.lua is loaded separately, into
# the client's own UiRuntime.)
entry = "init.lua"
