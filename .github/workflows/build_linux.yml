name: Build For Linux

on:
  workflow_call:

jobs:
  setup_metadata:
    uses: ./.github/workflows/setup_metadata.yml

  build:
    needs: setup_metadata
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        target: [linux]
        arch: [x86_64]
        build_type: [release, debug]
        include:
          - build_type: release
            cmake_build_type_keyword: Release
          - build_type: debug
            cmake_build_type_keyword: RelWithDebInfo
          - os: ubuntu-latest
            target: linux
          - target: linux
            arch: x86_64
            cxxflags: -m64

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          # raylib needs X11/GL headers; GameNetworkingSockets (Phase 1) will
          # additionally need: libssl-dev libprotobuf-dev protobuf-compiler.
          sudo apt-get install -y \
            ninja-build cmake build-essential \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build" -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ matrix.cmake_build_type_keyword }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}" \
            -DVB_WARNINGS_AS_ERRORS=ON \
            -DVB_HEADLESS=OFF

      - name: Build
        shell: bash
        run: cmake --build "${{ github.workspace }}/build"

      - name: Test
        shell: bash
        working-directory: build
        run: ctest --output-on-failure

      - name: Stage binaries
        shell: bash
        run: |
          dist="${{ github.workspace }}/dist"
          mkdir -p "$dist"
          cp "${{ github.workspace }}/build/voxel_browser" "$dist/"
          cp "${{ github.workspace }}/build/voxel_browser_server" "$dist/"

      - name: Export binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.setup_metadata.outputs.project_name }}-${{ matrix.target }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error
