name: Build For Mac OS

on:
  workflow_call:

jobs:
  setup_metadata:
    uses: ./.github/workflows/setup_metadata.yml

  build:
    needs: setup_metadata
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        target: [macos]
        arch: [universal]
        build_type: [release, debug]
        include:
          - build_type: release
            cmake_build_type_keyword: Release
          - build_type: debug
            cmake_build_type_keyword: RelWithDebInfo
          - os: macos-latest
            target: macos

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: latest

      - name: Install dependencies
        shell: bash
        run: brew install ninja

      - name: Configure
        shell: bash
        run: |
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build" -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ matrix.cmake_build_type_keyword }}" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DVB_WARNINGS_AS_ERRORS=ON \
            -DVB_HEADLESS=OFF \
            -DVB_WITH_LUA=ON

      - name: Build
        shell: bash
        run: cmake --build "${{ github.workspace }}/build"

      - name: Test
        shell: bash
        working-directory: build
        run: ctest --output-on-failure

      - name: Stage binaries
        shell: bash
        run: |
          dist="${{ github.workspace }}/dist"
          mkdir -p "$dist"
          cp "${{ github.workspace }}/build/voxel_browser" "$dist/"
          cp "${{ github.workspace }}/build/voxel_browser_server" "$dist/"

      - name: Export binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.setup_metadata.outputs.project_name }}-${{ matrix.target }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error
