name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  setup_metadata:
    uses: ./.github/workflows/setup_metadata.yml

  # Build at the tag itself so archive names and release.toml carry the tag's
  # version (artifacts from an earlier main build would be named for an older tag).
  build:
    uses: ./.github/workflows/runner.yml

  release:
    needs: [setup_metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.setup_metadata.outputs.project_name }}
          path: ${{ github.workspace }}

      # release.toml.sig: Ed25519 signature over release.toml (dev-cli.md "Release
      # signing"). Until release_keys.txt lists a key there is nothing to enforce,
      # so a missing secret only warns; once a key is listed, a release without a
      # valid signature would be refused by every vb, so it must fail here instead.
      - name: Sign release manifest
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            if grep -Eq '^[0-9a-fA-F]{64}$' release_keys.txt; then
              echo "::error::release_keys.txt lists a trusted key but the RELEASE_SIGNING_KEY secret is not set"
              exit 1
            fi
            echo "::warning::RELEASE_SIGNING_KEY is not set; publishing an unsigned release"
            exit 0
          fi
          key="$RUNNER_TEMP/release_key.pem"
          (umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          sh scripts/sign_release.sh release.toml "$key"
          rm -f "$key"

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ${{ github.workspace }}/${{ needs.setup_metadata.outputs.project_name }}-*.zip
            ${{ github.workspace }}/vb-*.zip
            ${{ github.workspace }}/release.toml
            ${{ github.workspace }}/scripts/install.sh
            ${{ github.workspace }}/scripts/install.ps1
            ${{ github.workspace }}/release.toml.sig
