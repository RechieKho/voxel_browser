name: Lint

on:
  workflow_dispatch:
  workflow_call:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run clang-format
        shell: bash
        run: |
          files=$(find src -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.c' -o -name '*.h' \))
          if [ -z "$files" ]; then
            echo "no source files to lint"; exit 0
          fi
          echo "$files"
          pipx run clang-format --style=file:.clang-format --dry-run --Werror $files
